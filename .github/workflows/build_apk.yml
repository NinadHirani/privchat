name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Initialize platform templates and overlay
        run: |
          cd app
          flutter create --org app.privchat --project-name privchat --platforms android,ios .
          python3 tool/setup_platforms.py
          flutter pub get
          flutter test

      - name: Set up Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true

      - name: Build Android APK
        run: |
          cd app
          flutter build apk --release --split-per-abi
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pritoy-android-apks
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            APP_VER=$(grep '^version:' app/pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
            TAG_NAME="v${APP_VER}"
          fi
          echo "Target Release Tag: $TAG_NAME"

          # Ensure the release exists before uploading
          gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG_NAME" --title "Pritoy $TAG_NAME" --notes "Automatic release for Pritoy $TAG_NAME" --repo "$GITHUB_REPOSITORY"

          cd app/build/app/outputs/flutter-apk/

          # Upload split APKs with both Pritoy- prefixed names and standard names
          gh release upload "$TAG_NAME" \
            app-arm64-v8a-release.apk#Pritoy-arm64-v8a-release.apk \
            app-armeabi-v7a-release.apk#Pritoy-armeabi-v7a-release.apk \
            app-x86_64-release.apk#Pritoy-x86_64-release.apk \
            --repo "$GITHUB_REPOSITORY" --clobber

